<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ТРИЗУБ // Киев-Неон 2094</title>
  <meta name="description" content="Внешний контур Гетьманату. Художественная альтернативная история: Украина-сверхдержава 2094 года, карта мира, персонажи, хроники и лавка mesh.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="boot" class="boot" role="dialog" aria-label="Подключение к сети"></div>
  <div class="shell">
    <header class="topbar">
      <button class="brand" type="button" data-go="portal">
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <span>
          <b>ТРИЗУБ</b>
          <small>Киев-Неон · 2094</small>
        </span>
      </button>
      <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
      <div class="top-meta">
        <span class="hide-sm">четверг · 23.09.2094</span>
        <span class="hide-sm">₴q 1.00</span>
        <span class="pulse"><i></i> канал</span>
        <button class="btn small gold" id="cart-btn" type="button">Корзина · 0</button>
        <button class="btn small menu-btn" id="menu-btn" type="button" aria-expanded="false">Меню</button>
      </div>
    </header>
    <div class="body">
      <nav class="rail" id="rail" aria-label="Разделы сети"></nav>
      <main id="main" tabindex="-1"></main>
    </div>
    <footer class="status">
      <span>внешний контур · <b>русский</b> · язык государства · <b>українська</b></span>
      <span>Воля. Зв'язок. Земля. · художественный мир</span>
      <span id="mesh-stat">mesh 99.2%</span>
    </footer>
  </div>
  <div id="drawer" class="drawer" hidden></div>
  <script src="js/content.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
